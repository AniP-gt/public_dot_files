# プレフィックスキーをCtrl+qに変更unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# マウス操作を有効化
set-option -g mouse on

# 256色対応
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# フォーカスイベントを有効化set-option -g focus-events on

# スクロールバックバッファの行数を設定
set -g history-limit 100000

# キーバインドをvi風に
setw -g mode-keys vi

# ペインの分割
# prefix + v で垂直分割（左右にペインを作成）
bind | split-window -h -c "#{pane_current_path}"
# prefix + h で水平分割（上下にペインを作成）
bind - split-window -v -c "#{pane_current_path}"

# デフォルトの分割キーを無効化
# unbind '"'
# unbind %

# 新しいウィンドウも現在のパスで作成
bind c new-window -c "#{pane_current_path}"

# ペインの移動（既存のvim風キーバインドを保持）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# option + [] でペイン移動
bind -n M-] select-pane -t :.+
bind -n M-[ select-pane -t :.-

# Option + 左矢印 で前のウィンドウ
bind -n M-Left previous-window

# Option + 右矢印 で次のウィンドウ
bind -n M-Right next-window

# Option + 数字 でウィンドウ選択
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# プレフィックス不要のペイン移動は削除（Neovimとの競合回避）
# vim風ペイン移動はプレフィックス付きのみ使用

# ペインのリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ウィンドウとペインの番号を1から開始
set -g base-index 1
setw -g pane-base-index 1

# 設定ファイルの再読み込み
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ステータスラインの位置を下部に設定
set -g status-position bottom

# # 非アクティブな窓ガラス
# set -g window-style 'bg=#303030'
#
# # アクティブな窓ガラス
# set -g window-active-style 'bg=#000000'

set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39,bold'

# メッセージの色
set -g message-style 'fg=#2e3440,bg=#ebcb8b'
set -g message-command-style 'fg=#2e3440,bg=#d08770'

# tmux-powerline設定
set -g status-left-length 100
set -g status-left "#(~/.tmux/plugins/tmux-powerline/powerline.sh left)"
set -g status-right-length 150
set -g status-right "#(~/.tmux/plugins/tmux-powerline/powerline.sh right)"

# ウィンドウタイトルの設定
set -g window-status-format '#[fg=#2e3440,bg=#3b4252] #I #[fg=#3b4252,bg=#2e3440]#[fg=#d8dee9,bg=#2e3440] #W #[fg=#2e3440,bg=#2e3440]'
set -g window-status-current-format '#[fg=#2e3440,bg=#81a1c1] #I #[fg=#81a1c1,bg=#2e3440]#[fg=#eceff4,bg=#2e3440,bold] #W #[fg=#2e3440,bg=#2e3440]'

# ウィンドウ名の自動更新を無効化
set -g allow-rename off

set -g allow-passthrough on
set -g focus-events on

# アクティビティの監視
setw -g monitor-activity on
set -g visual-activity on

# コピーモードの設定
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ----- tmux plugins -----
# TPM
set -g @plugin 'tmux-plugins/tpm'

# tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' 
set -g @plugin 'erikw/tmux-powerline'
# TPM 初期化（必ず最後）
run '~/.tmux/plugins/tpm/tpm'
