# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = true           # Custom: デフォルトで隠しファイルを表示
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "lanczos3"    # Custom: より高品質なフィルター (デフォルトはtriangle)
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
# Default openers
edit = [
	{ run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
	{ run = 'code %*',    orphan = true, desc = "code",           for = "windows" },
	{ run = 'code -w %*', block = true,  desc = "code (block)",   for = "windows" },
]
open = [
	{ run = 'xdg-open "$1"',                desc = "Open", for = "linux" },
	{ run = 'open "$@"',                    desc = "Open", for = "macos" },
	{ run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
	{ run = 'termux-open "$1"',             desc = "Open", for = "android" },
]
reveal = [
	{ run = 'xdg-open "$(dirname "$1")"',           desc = "Reveal", for = "linux" },
	{ run = 'open -R "$1"',                         desc = "Reveal", for = "macos" },
	{ run = 'explorer /select,"%1"', orphan = true, desc = "Reveal", for = "windows" },
	{ run = 'termux-open "$(dirname "$1")"',        desc = "Reveal", for = "android" },
	{ run = '''clear; exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
	{ run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
	{ run = 'ya pub extract --list %*',   desc = "Extract here", for = "windows" },
]
play = [
	{ run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
	{ run = 'mpv --force-window %*', orphan = true, for = "windows" },
	{ run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]

# Custom openers (macOS specific)
pager = [
	{ run = 'less "$@"', block = true, for = "unix" },
]
image = [
	{ run = 'open "$@"', orphan = true, for = "macos" },
]
pdf = [
	{ run = 'open "$@"', orphan = true, for = "macos" },
]
video = [
	{ run = 'open "$@"', orphan = true, for = "macos" },
]
browser = [
	{ run = 'open "$@"', orphan = true, for = "macos" },
]
audio = [
	{ run = 'afplay "$@"', block = true, for = "macos" },
]
midi = [
	{ run = 'timidity -Od "$@"', block = true, for = "macos" },
]
disk_image = [
	{ run = 'open "$@"', orphan = true, for = "macos" },
]
archive = [
	{ run = 'open "$@"', orphan = true, for = "macos" },
]

[open]
rules = [
	# Folder
	{ name = "*/", use = [ "edit", "open", "reveal" ] },

	# Custom: JSON files (より具体的なルールを先に記述)
	{ mime = "application/{json,ndjson}", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "edit", "reveal" ] },
	{ mime = "*/json", use = "edit" },
	{ name = "*.json", use = "edit" },

	# Custom: macOS disk images (dmg, pkg, app)
	{ mime = "application/x-apple-diskimage", use = "disk_image" },
	{ mime = "application/x-disk-image", use = "disk_image" },
	{ name = "*.dmg", use = "disk_image" },
	{ name = "*.pkg", use = "disk_image" },
	{ name = "*.app", use = "disk_image" },

	# Text
	{ mime = "text/*", use = [ "edit", "reveal" ] },

	# Image
	{ mime = "image/*", use = [ "open", "reveal" ] },

	# Custom: MIDI files (audio/*より先に記述)
	{ mime = "audio/midi", use = "midi" },
	{ mime = "audio/x-midi", use = "midi" },
	{ name = "*.mid", use = "midi" },
	{ name = "*.midi", use = "midi" },

	# Media
	{ mime = "audio/*", use = [ "audio", "reveal" ] },
	{ name = "*.mp4", use = [ "video", "reveal" ] },
	{ name = "*.mov", use = [ "video", "reveal" ] },
	{ mime = "video/*", use = [ "video", "reveal" ] },

	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },

	# Custom: Additional archive formats
	{ mime = "application/x-tar", use = "archive" },
	{ mime = "application/x-gzip", use = "archive" },
	{ mime = "application/x-bzip2", use = "archive" },
	{ mime = "application/x-7z-compressed", use = "archive" },
	{ name = "*.tar.gz", use = "archive" },
	{ name = "*.tgz", use = "archive" },
	{ name = "*.tar.bz2", use = "archive" },

	# PDF
	{ mime = "application/pdf", use = "pdf" },

	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },

	# Directory
	{ mime = "inode/directory", use = "edit" },

	# Fallback
	{ name = "*", use = [ "open", "reveal" ] },
]

[tasks]
micro_workers    = 5            # Custom: 小規模タスクのワーカー数 (デフォルトは10)
macro_workers    = 10
bizarre_retry    = 5            # Custom: リトライ回数 (デフォルトは3)
image_alloc      = 536870912    # 512MB
image_bound      = [ 5000, 5000 ]
suppress_preload = false

[plugin]
# Custom: Git fetcher plugin
prepend_fetchers = [
	{ id = "git", name = "*", run = "git" },
	{ id = "git", name = "*/", run = "git" },
]
#
# fetchers = [
# 	# Mimetype
# 	{ id = "mime", name = "*", run = "mime", prio = "high" },
# ]
spotters = [
	{ name = "*/", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# Fallback
	{ name = "*", run = "file" },
]
preloaders = [
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
]
